name: PR Checks

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

concurrency:
    group: pr-checks-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    unit:
        name: Unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            VITE_API_URL: http://localhost:8080
            VITE_KAKAO_APP_KEY: test-kakao-app-key
            VITE_MAP_PROVIDER: kakao

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run unit tests
              run: pnpm test:run

    e2e:
        name: E2E tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            VITE_API_URL: http://localhost:8080
            VITE_KAKAO_APP_KEY: ${{ secrets.VITE_KAKAO_APP_KEY }}
            VITE_MAP_PROVIDER: ${{ secrets.VITE_MAP_PROVIDER }}

        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Validate E2E environment
              run: |
                  if [ -z "$VITE_KAKAO_APP_KEY" ]; then
                      echo "::error::VITE_KAKAO_APP_KEY secret is required for E2E tests."
                      exit 1
                  fi

            - name: Install Playwright browser
              run: pnpm exec playwright install --with-deps chromium

            - name: Run E2E tests
              run: pnpm test:e2e

            - name: Upload Playwright artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-artifacts
                  path: test-results/
                  if-no-files-found: ignore
