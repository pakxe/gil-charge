name: Deploy Prod

on:
    push:
        tags:
            - "v*"

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Create frontend env file
              run: |
                  cat > .env.production <<'EOF'
                  ${{ secrets.FRONTEND_ENV_PROD }}
                  EOF

            - name: Install frontend dependencies
              run: npm ci

            - name: Build frontend
              run: npm run build

            - name: Upload frontend build to temp directory
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.OCI_HOST }}
                  username: ${{ secrets.OCI_USER }}
                  key: ${{ secrets.OCI_SSH_KEY }}
                  port: ${{ secrets.OCI_PORT }}
                  source: "dist/*"
                  target: "/tmp/pakxe-frontend-dist"

            - name: Deploy frontend and backend on server
              uses: appleboy/ssh-action@v1.2.0
              env:
                  BACKEND_ENV_PROD: ${{ secrets.BACKEND_ENV_PROD }}
                  TAG_NAME: ${{ github.ref_name }}
              with:
                  host: ${{ secrets.OCI_HOST }}
                  username: ${{ secrets.OCI_USER }}
                  key: ${{ secrets.OCI_SSH_KEY }}
                  port: ${{ secrets.OCI_PORT }}
                  envs: BACKEND_ENV_PROD,TAG_NAME
                  script: |
                      set -e

                      echo "Deploying tag: $TAG_NAME"

                      # backend code checkout
                      cd /opt/pakxe-repo
                      git fetch --all --tags
                      git checkout "$TAG_NAME"

                      # backend env
                      cat > /opt/pakxe-repo/opinet-proxy/.env <<'EOF'
                      $BACKEND_ENV_PROD
                      EOF

                      # backend install + restart
                      cd /opt/pakxe-repo/opinet-proxy
                      npm ci

                      if pm2 describe pakxe-api > /dev/null; then
                        pm2 restart pakxe-api --update-env
                      else
                        pm2 start "node src/app.js" --name pakxe-api
                      fi

                      pm2 save

                      # frontend deploy
                      rm -rf /var/www/pakxe-frontend/*
                      cp -r /tmp/pakxe-frontend-dist/dist/* /var/www/pakxe-frontend/

                      # cleanup
                      rm -rf /tmp/pakxe-frontend-dist
